---
name: metal-stack component release

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  build:
    uses: metal-stack/actions-common/.github/workflows/container-build.yaml@v1
    secrets: inherit

  build-minimal:
    uses: metal-stack/actions-common/.github/workflows/container-build.yaml@allow-passing-targets
    secrets: inherit
    with:
      target: minimal
      image-name: ${{ github.repository }}-minimal

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - build-minimal
    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Test
      run: |
        make test
      env:
        TAG: ${{ needs.build-minimal.outputs.push-image }}:${{ needs.build-minimal.outputs.push-tag }}

  sign-keyless:
    name: Sign keyless
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write'
      packages: 'write'
    needs:
      - build
      - build-minimal
    steps:
    - uses: google-github-actions/auth@v3
      id: auth
      with:
        workload_identity_provider: projects/723287855471/locations/global/workloadIdentityPools/github/providers/github-actions
        service_account: keyless@metal-stack.iam.gserviceaccount.com
        token_format: id_token
        id_token_audience: sigstore
        id_token_include_email: true

    - name: Install Cosign
      uses: sigstore/cosign-installer@v4.1.3

    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Sign images
      run: |
        cosign sign --yes --identity-token=${{ steps.auth.outputs.id_token }} \
          ${{ needs.build.outputs.push-image }}:${{ needs.build.outputs.push-tag }} \
          ${{ needs.build-minimal.outputs.push-image }}:${{ needs.build-minimal.outputs.push-tag }} \
          ${{ needs.build.outputs.push-image }}@${{ needs.build.outputs.push-digest }} \
          ${{ needs.build-minimal.outputs.push-image }}@${{ needs.build-minimal.outputs.push-digest }}
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
